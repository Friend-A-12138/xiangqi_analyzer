{% extends "base.html" %}

{% block title %}中国象棋AI分析器{% endblock %}

{% block extra_css %}
<style>
    .board-wrap {
        position: relative;
        display: inline-block;
        padding: 6px;
        background: #f7e2b6;
        border: 1px solid #d2a86a;
        border-radius: 6px;
    }
    .board-grid {
        display: grid;
        grid-template-columns: 22px repeat(9, 42px);
        grid-auto-rows: auto;
        align-items: center;
    }
    .board-label {
        font-size: 11px;
        color: #8a6d3b;
        text-align: center;
        line-height: 40px;
        height: 40px;
    }
    .board-grid .chess-cell {
        width: 40px;
        height: 40px;
        line-height: 40px;
        margin: 1px;
        border: 1px solid #e0c9a0;
        background: #fffaf0;
        font-size: 15px;
    }
    .board-arrow-layer {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        overflow: visible;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <!-- 控制面板 -->
    <div class="col-lg-4">
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="bi bi-controller"></i> 控制面板</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">状态</label>
                    <div>
                        <span id="status-badge" class="badge bg-secondary">
                            <i class="bi bi-stop-circle"></i> 未运行
                        </span>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">信号源</label>
                    <div class="text-muted small" id="source-info">
                        未配置
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button id="start-btn" class="btn btn-success" onclick="toggleAnalysis()">
                        <i class="bi bi-play-fill"></i> 开始分析
                    </button>
                    <button id="stop-btn" class="btn btn-danger" onclick="toggleAnalysis()" style="display: none;">
                        <i class="bi bi-stop-fill"></i> 停止分析
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 实时预览 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="bi bi-camera-video"></i> 实时预览</h5>
            </div>
            <div class="card-body">
                <div id="preview-container" class="text-center">
                    <div class="text-muted">
                        <i class="bi bi-image" style="font-size: 3rem;"></i>
                        <p>等待画面...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 分析结果 -->
    <div class="col-lg-8">
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="bi bi-chess"></i> 棋盘分析</h5>
            </div>
            <div class="card-body">
                <div id="analysis-result">
                    <div class="text-center text-muted">
                        <i class="bi bi-hourglass-split" style="font-size: 3rem;"></i>
                        <p>等待分析结果...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 推荐走法 -->
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-lightbulb"></i> AI推荐走法</h5>
            </div>
            <div class="card-body">
                <div id="recommendation">
                    <div class="text-center text-muted">
                        <i class="bi bi-question-circle" style="font-size: 3rem;"></i>
                        <p>等待推荐走法...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 上传图片分析 -->
<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-upload"></i> 上传图片分析</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="file" class="form-control" id="image-upload" accept="image/*">
                </div>
                <button class="btn btn-primary" onclick="uploadImage()">
                    <i class="bi bi-search"></i> 分析图片
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 棋谱批量分析 -->
<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-images"></i> 棋谱批量分析</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="file" class="form-control" id="batch-upload" accept="image/*" multiple>
                    <div class="form-text">一次最多10张，逐张分析，单张失败不影响其他图片</div>
                </div>
                <button class="btn btn-primary" onclick="uploadBatch()">
                    <i class="bi bi-search"></i> 批量分析
                </button>
                <div id="batch-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// SocketIO连接
const socket = io();

let isRunning = false;

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    updateStatus();
    
    // 监听Socket事件
    socket.on('status', function(data) {
        isRunning = data.running;
        updateUI();
    });
    
    socket.on('preview', function(data) {
        updatePreview(data.image);
    });
    
    socket.on('analysis_result', function(data) {
        updateAnalysisResult(data);
        updateRecommendation(data);
    });
});

// 更新状态
function updateStatus() {
    fetch('/api/status')
        .then(response => response.json())
        .then(data => {
            isRunning = data.running;
            updateUI();
        })
        .catch(error => console.error('Error:', error));
}

// 更新UI
function updateUI() {
    const statusBadge = document.getElementById('status-badge');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    
    if (isRunning) {
        statusBadge.className = 'badge bg-success';
        statusBadge.innerHTML = '<i class="bi bi-play-circle"></i> 运行中';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
    } else {
        statusBadge.className = 'badge bg-secondary';
        statusBadge.innerHTML = '<i class="bi bi-stop-circle"></i> 未运行';
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
    }
}

// 切换分析状态
function toggleAnalysis() {
    if (isRunning) {
        stopAnalysis();
    } else {
        startAnalysis();
    }
}

// 开始分析
function startAnalysis() {
    fetch('/api/start', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                isRunning = true;
                updateUI();
            } else {
                alert('启动失败: ' + (data.error || '未知错误'));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('启动失败: ' + error.message);
        });
}

// 停止分析
function stopAnalysis() {
    fetch('/api/stop', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                isRunning = false;
                updateUI();
            } else {
                alert('停止失败: ' + (data.error || '未知错误'));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('停止失败: ' + error.message);
        });
}

// 更新预览
function updatePreview(imageData) {
    const container = document.getElementById('preview-container');
    container.innerHTML = `<img src="${imageData}" class="preview-image" alt="实时预览">`;
}

// 更新分析结果
function updateAnalysisResult(data) {
    const analysisDiv = document.getElementById('analysis-result');

    const view = data.view || data.layout_2d || [];
    const squares = data.squares_view || [];
    const orientation = data.orientation;

    let html = '<div class="mb-3">';
    html += `<p><strong>检测时间:</strong> ${Number(data.detect_time || 0).toFixed(3)}s</p>`;
    html += `<p><strong>置信度:</strong> ${Number(data.confidence || 0).toFixed(3)}</p>`;
    html += '<p><strong>FEN:</strong> <code>' + data.fen + '</code></p>';
    html += '<p class="mb-0"><strong>显示朝向:</strong> ';
    html += orientation === 'black_bottom'
        ? '<span class="badge bg-dark">黑方在下（我执黑）</span>'
        : '<span class="badge bg-danger">红方在下（我执红）</span>';
    html += ' <span class="text-muted small">棋盘、坐标与箭头均按此朝向显示</span></p>';
    html += '</div>';

    if (view.length > 0) {
        html += '<div class="board-wrap" id="board-wrap">';
        html += '<div class="board-grid" id="chessboard-grid">';

        // 行坐标（rank）与棋子：顺序已由后端按显示朝向算好，这里不再翻转
        for (let r = 0; r < view.length; r++) {
            const rank = squares.length ? String(squares[r][0]).substring(1) : '';
            html += `<div class="board-label">${rank}</div>`;

            for (let c = 0; c < view[r].length; c++) {
                const name = view[r][c];
                const square = squares.length ? squares[r][c] : '';
                let cssClass = 'chess-cell';

                if (name && name.indexOf('红') === 0) {
                    cssClass += ' chess-red';
                } else if (name && name.indexOf('黑') === 0) {
                    cssClass += ' chess-black';
                } else if (name === '.') {
                    cssClass += ' chess-empty';
                }

                const text = (name === '.' || !name) ? '' : name;
                html += `<span class="${cssClass}" data-square="${square}" title="${square}">${text}</span>`;
            }
        }

        // 列坐标（file）
        html += '<div class="board-label"></div>';
        for (let c = 0; c < 9; c++) {
            const file = squares.length
                ? String(squares[view.length - 1][c]).substring(0, 1)
                : '';
            html += `<div class="board-label">${file}</div>`;
        }

        html += '</div>';
        html += '<svg class="board-arrow-layer" id="board-arrow-layer"></svg>';
        html += '</div>';
    }

    analysisDiv.innerHTML = html;
}

// 上传图片分析
function uploadImage() {
    const fileInput = document.getElementById('image-upload');
    const file = fileInput.files[0];
    
    if (!file) {
        alert('请选择图片');
        return;
    }
    
    const formData = new FormData();
    formData.append('image', file);
    
    fetch('/api/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert('分析失败: ' + data.error);
        } else {
            updateAnalysisResult(data);
            updateRecommendation(data);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('上传失败: ' + error.message);
    });
}

// 更新推荐走法显示
function updateRecommendation(data) {
    const recommendationDiv = document.getElementById('recommendation');
    let recHtml = '';

    if (data.best_move) {
        const move = data.best_move;
        const fromPos = move.substring(0, 2);
        const toPos = move.substring(2, 4);

        recHtml += '<div class="alert alert-success">';
        recHtml += '<h4><i class="bi bi-award"></i> 最佳走法</h4>';

        if (data.best_move_cn) {
            recHtml += '<p class="fs-4 mb-1"><strong>' + data.best_move_cn + '</strong>' +
                       ' <span class="text-muted small">(' + move + ')</span></p>';
        } else {
            recHtml += '<p class="fs-4 mb-1"><strong>' + move + '</strong></p>';
            if (data.move_note && data.move_note.error) {
                recHtml += '<p class="small text-warning mb-1">中文记谱暂不可用：' +
                           data.move_note.error + '</p>';
            }
        }

        recHtml += '<p class="mb-1">' + fromPos + ' → ' + toPos + '</p>';

        if (data.score) {
            if (typeof data.score === 'string' && data.score.startsWith('MateIn')) {
                recHtml += '<p><i class="bi bi-trophy"></i> 能在 ' + data.score.substring(6) + ' 步内将死</p>';
            } else {
                const score = parseFloat(data.score);
                if (score > 0) {
                    recHtml += '<p><i class="bi bi-arrow-up"></i> 红方优势 +' + score.toFixed(2) + '</p>';
                } else if (score < 0) {
                    recHtml += '<p><i class="bi bi-arrow-down"></i> 黑方优势 ' + score.toFixed(2) + '</p>';
                } else {
                    recHtml += '<p><i class="bi bi-balance-scale"></i> 双方均势</p>';
                }
            }
        }

        recHtml += '</div>';
    } else {
        recHtml = '<div class="alert alert-warning">';
        recHtml += '<i class="bi bi-exclamation-triangle"></i> 无法计算推荐走法';
        recHtml += '</div>';
    }

    recommendationDiv.innerHTML = recHtml;
}

// 批量分析
function uploadBatch() {
    const input = document.getElementById('batch-upload');
    
    if (!input.files || input.files.length === 0) {
        alert('请选择图片');
        return;
    }
    
    const formData = new FormData();
    Array.from(input.files).forEach(function(file) {
        formData.append('images', file);
    });
    
    const container = document.getElementById('batch-result');
    container.innerHTML = '<div class="text-muted small">正在分析，请稍候...</div>';
    
    fetch('/api/upload_batch', { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                container.innerHTML = '<div class="alert alert-warning">' + data.error + '</div>';
                return;
            }
            renderBatchResult(data);
        })
        .catch(error => {
            container.innerHTML = '<div class="alert alert-danger">批量分析失败: ' +
                                  error.message + '</div>';
        });
}

// 渲染批量分析结果
function renderBatchResult(data) {
    let html = '<p class="small">共 ' + data.total + ' 张，成功 ' + data.success +
               ' 张，失败 ' + data.failed + ' 张</p>';
    
    html += '<div class="table-responsive"><table class="table table-sm align-middle">';
    html += '<thead><tr><th>文件名</th><th>FEN</th><th>推荐走法</th><th>中文记谱</th><th>评估</th><th>耗时</th></tr></thead><tbody>';
    
    data.results.forEach(function(item) {
        html += '<tr>';
        html += '<td class="small">' + item.filename + '</td>';
        
        if (item.success) {
            html += '<td><code class="small">' + item.fen + '</code></td>';
            html += '<td>' + (item.best_move || '-') + '</td>';
            html += '<td><strong>' + (item.best_move_cn || '-') + '</strong></td>';
            html += '<td>' + formatScore(item.score) + '</td>';
            html += '<td class="small">' + item.detect_time.toFixed(2) + 's</td>';
        } else {
            html += '<td colspan="5" class="text-danger small">' +
                    (item.error || '分析失败') + '</td>';
        }
        
        html += '</tr>';
    });
    
    html += '</tbody></table></div>';
    document.getElementById('batch-result').innerHTML = html;
}

// 格式化引擎评分
function formatScore(score) {
    if (score === null || score === undefined || score === '') {
        return '-';
    }
    
    if (typeof score === 'string' && score.startsWith('MateIn')) {
        return '将死(' + score.substring(6) + '步)';
    }
    
    return parseFloat(score).toFixed(2);
}
</script>
{% endblock %}
